# Video-Generation-arxiv-daily configuration for paper-lab
max_results: 30

publish_readme: true
publish_gitpage: false
publish_wechat: false
show_badge: false
update_paper_links: false
enable_github_search: false

json_readme_path: './docs/vg-arxiv-daily.json'
md_readme_path: 'README.md'
json_gitpage_path: './docs/vg-arxiv-daily-web.json'
md_gitpage_path: './docs/index.md'
json_wechat_path: './docs/vg-arxiv-daily-wechat.json'
md_wechat_path: './docs/wechat.md'

keywords:
  "Video Generation":
    filters: ["Text-to-Video", "Text2Video", "image-to-video", "video diffusion model", "video generation model", "video synthesis"]
  "World Models":
    filters: ["world model", "video world model", "action-conditioned video", "interactive world model", "driving world model", "closed-loop simulation", "neural simulation", "world action model"]
  "Autoregressive and Streaming Video":
    filters: ["autoregressive video", "causal video generation", "diffusion forcing", "self-forcing", "streaming video generation", "long video generation", "temporal consistency video"]
  "Efficient Video Diffusion":
    filters: ["real-time video generation", "video diffusion acceleration", "step distillation video", "few-step video generation", "sparse attention video", "cache reuse diffusion", "KV cache video"]