name: Daily arXiv Update

on:
  schedule:
    # Run at 00:00 and 12:00 UTC every day.
    - cron: '0 */12 * * *'
  workflow_dispatch:
    inputs:
      max_papers:
        description: Number of must-read papers for Cursor to read in full
        required: true
        default: '3'

permissions:
  contents: write

concurrency:
  group: daily-arxiv-update
  cancel-in-progress: false

jobs:
  update-papers:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: pip

    - name: Install dependencies
      run: python -m pip install -r requirements.txt

    - name: Run daily update
      run: python daily_arxiv.py

    - name: Build ranked research digest
      env:
        LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
        LLM_MODEL: ${{ vars.LLM_MODEL }}
      run: python rank_papers.py

    - name: Read and summarize 3 must-read papers with Cursor
      continue-on-error: true
      env:
        CURSOR_API_KEY: ${{ secrets.PAPER_READING }}
        CURSOR_MODEL: ${{ vars.CURSOR_MODEL }}
        MAX_PAPERS: ${{ github.event_name == 'workflow_dispatch' && inputs.max_papers || '3' }}
      run: |
        if [ -z "$CURSOR_API_KEY" ]; then
          echo "CURSOR_API_KEY is not configured; keeping the rule-only digest."
          exit 0
        fi
        python -m pip install cursor-sdk pypdf
        python cursor_summarize.py \
          --digest docs/digests/latest.json \
          --max-papers "$MAX_PAPERS"

    - name: Check for changes
      id: verify_diff
      run: |
        git diff --quiet . || echo "changes=true" >> $GITHUB_OUTPUT

    - name: Commit and push if changed
      if: steps.verify_diff.outputs.changes == 'true'
      run: |
        git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add -A
        git commit -m "Daily arXiv update $(date +'%Y-%m-%d')"
        git push