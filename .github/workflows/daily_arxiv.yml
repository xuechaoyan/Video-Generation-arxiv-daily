name: Daily arXiv Update

on:
  schedule:
    # Run once per day at 00:00 UTC.
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-arxiv-update
  cancel-in-progress: false

jobs:
  update-papers:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
        cache: pip

    - name: Install dependencies
      run: python -m pip install -r requirements.txt

    - name: Run daily update
      run: python daily_arxiv.py

    - name: Build ranked research digest
      run: python rank_papers.py

    - name: Read and summarize top 10 papers with Cursor
      continue-on-error: true
      env:
        CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        CURSOR_MODEL: ${{ vars.CURSOR_MODEL }}
      run: |
        if [ -z "$CURSOR_API_KEY" ]; then
          echo "CURSOR_API_KEY is not configured; keeping the rule-only digest."
          exit 0
        fi
        python -m pip install cursor-sdk pypdf
        python cursor_summarize.py \
          --digest "docs/digests/$(date -u +'%F').json" \
          --max-papers 10

    - name: Check for changes
      id: verify_diff
      run: |
        git diff --quiet . || echo "changes=true" >> $GITHUB_OUTPUT

    - name: Commit and push if changed
      if: steps.verify_diff.outputs.changes == 'true'
      run: |
        git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add -A
        git commit -m "Daily arXiv update $(date +'%Y-%m-%d')"
        git push